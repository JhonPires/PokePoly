<!doctype html>
<html lang="pt-BR">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Teste de batalha · PokéPoly</title>
 <link rel="icon" type="image/svg+xml" href="../assets/brand/favicon.svg">
 <link rel="stylesheet" href="battle-test.css">
</head>
<body>
 <main>
  <header><img src="../assets/brand/pokepoly-logo.png" alt="PokéPoly"><a href="../index.html">Voltar ao tabuleiro</a></header>
  <section class="test-panel">
   <div class="heading"><div><p class="eyebrow">DUELO DE TESTE</p><h1>Arena rápida</h1><p>25 segundos para vencer. O resultado deste teste não altera nenhuma partida.</p></div><div class="test-actions"><label>Região<select id="region"><option value="kanto">Kanto</option><option value="johto">Johto</option><option value="hoenn">Hoenn</option><option value="sinnoh">Sinnoh</option><option value="unova">Unova</option><option value="kalos">Kalos</option><option value="alola">Alola</option><option value="galar">Galar</option><option value="paldea">Paldea</option></select></label><button id="restart" class="primary">Iniciar duelo</button></div></div>
   <p id="matchup" class="matchup"></p>
   <div class="battle-stage"><canvas id="arena" width="800" height="460" aria-label="Arena de teste"></canvas>
   <div id="controls"><div class="arena-stick" data-control="stick" aria-label="Controle de movimento"><span></span></div><div class="pad"><button data-control="up" aria-label="Mover para cima">▲</button><button data-control="left" aria-label="Mover para a esquerda">◀</button><button data-control="down" aria-label="Mover para baixo">▼</button><button data-control="right" aria-label="Mover para a direita">▶</button></div><div class="actions"><button data-control="basic">J · Golpe</button><button data-control="special">K · Especial</button><button data-control="dash">⇧ · Dash</button></div></div></div>
   <p class="hint">WASD ou setas para mover · J e K para atacar · Shift para dash</p>
   <p id="result" role="status" aria-live="polite">Duelo pronto.</p>
   <small>Sprites: <a href="https://github.com/PMDCollab/SpriteCollab" target="_blank" rel="noopener noreferrer">PMD Collab SpriteCollab</a> · Efeitos: <a href="https://github.com/DistTopic/padventures-sprites" target="_blank" rel="noopener noreferrer">PAdventures Sprites</a></small>
  </section>
 </main>
 <script type="module" src="battle-test.js"></script>
</body>
</html>
